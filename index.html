<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d6 terminal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div id="terminal">
            <div id="header"></div>
            <div id="terminal-container">
                <div id="output"></div>
                <div class="prompt-line">
                    <span class="prompt">&gt;</span>
                    <input id="input" type="text" autocomplete="off" spellcheck="false" autofocus>
                </div>
            </div>
            <br>
            <div id="history" class="opacity margin-top-20"></div>
        </div>
    </div>

    <!-- Ordem importa: classes primeiro, Game depende delas, terminal.js inicia tudo -->
    <script src="js/inventory.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/helper.js"></script>
    <script src="js/embedding.js"></script>
    <script src="js/game.js"></script>
    <script src="ogreHunterChapter.js"></script>
    <script src="js/terminal.js"></script>
</body>

</html>
